<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Numbers</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #fafafa;
    color: #222;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    line-height: 1.5;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

  details {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  summary {
    font-weight: 600;
    cursor: pointer;
    color: #444;
  }
  summary:hover { color: #000; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full-width { grid-column: 1 / -1; }
  label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #666;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  input[type="number"] {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  input[type="checkbox"] { accent-color: #333; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .checkbox-row label {
    text-transform: none;
    font-weight: 500;
    color: #333;
    margin-bottom: 0;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #444; }

  .results {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .results h2 {
    font-size: 1rem;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }

  .output-line {
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    padding: 4px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .output-line:last-child { border-bottom: none; }

  .sequence-line {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    padding: 6px 8px;
    background: #f8f8f8;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .sequence-line .num { font-weight: 600; color: #333; }
  .sequence-line .arrow { color: #888; }

  .hash-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin-top: 8px;
  }
  .hash-table th, .hash-table td {
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
  .hash-table th {
    font-weight: 600;
    color: #666;
    font-size: 0.75rem;
    text-transform: uppercase;
  }
  .hash-table tr { transition: background 0.3s; }
  .hash-table tr:hover { background: #f0f0f0; }
  .hash-table tr.highlight {
    background: #fff3cd;
    animation: flash 1s ease-out;
  }
  @keyframes flash {
    0% { background: #ffeb3b; }
    100% { background: #fff3cd; }
  }
  .hash-table a {
    color: #1565c0;
    text-decoration: underline;
    cursor: pointer;
  }
  .hash-table a:hover { color: #0d47a1; }

  .graph-container {
    overflow-x: auto;
    margin-top: 8px;
    padding: 8px 0;
  }
  .graph-svg {
    display: block;
    margin: 0 auto;
  }
  .graph-legend {
    text-align: center;
    font-size: 0.8rem;
    margin-top: 8px;
    color: #666;
  }
  .legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin: 0 4px 0 12px;
  }
  .legend-dot.happy { background: #4caf50; }
  .legend-dot.sad { background: #f44336; }

  .footer {
    text-align: center;
    color: #888;
    font-size: 0.8rem;
    margin-top: 24px;
  }
</style>
<script>
  function jumpTo(id) {
    var el = document.getElementById('num-' + id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('highlight');
      setTimeout(function() { el.classList.remove('highlight'); }, 1200);
    }
  }
</script>
</head>
<body>
  <h1>Happy Numbers</h1>
  <p class="subtitle">Find happy numbers with custom parameters</p>

  <details>
    <summary>Parameters</summary>
    <form method="GET" action="/">
      <div class="form-grid">
        <div class="form-group">
          <label for="limit">Limit</label>
          <input type="number" id="limit" name="limit" value="9" min="1" max="1000">
        </div>
        <div class="form-group">
          <label for="base">Base</label>
          <input type="number" id="base" name="base" value="10" min="2" max="36">
        </div>
        <div class="form-group">
          <label for="pow">Power</label>
          <input type="number" id="pow" name="pow" value="2" min="1" max="10">
        </div>
        <div class="form-group full-width">
          <div class="checkbox-row">
            <input type="checkbox" id="pure" name="pure" value="1">
            <label for="pure">Pure (unique by digit signature)</label>
          </div>
        </div>
      </div>
      <button type="submit">Calculate</button>
    </form>
  </details>

  <!--RESULTS_PLACEHOLDER-->

  <div class="footer">
    Powered by Raku
  </div>
</body>
</html>
